<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Echo · 英语语音陪练</title>
<meta name="description" content="说英语，Echo 用英语回你，教你更地道的说法，还能跟读打分。">
<meta name="theme-color" content="#faf6ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Echo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">E</span>
      <div class="brand-text">
        <h1>Echo</h1>
        <p>英语语音陪练 <span class="ver">v7</span></p>
      </div>
    </div>
    <div class="top-actions">
      <button id="btnLang" class="lang-btn" type="button" aria-label="切换识别语言">中</button>
      <button id="btnSettings" class="icon-btn" type="button" aria-label="打开设置">&#9881;</button>
    </div>
  </header>

  <main id="chat" class="chat" aria-live="polite"></main>

  <div class="bottom">
    <div id="listeningBar" class="listening-bar" hidden>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span id="interim">在听你说……</span>
    </div>

    <form id="textForm" class="text-form" hidden>
      <input id="textInput" type="text" placeholder="也可以打字输入英文…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
      <button type="submit" class="send-btn">发送</button>
    </form>

    <footer class="composer">
      <button id="btnKeyboard" class="side-btn" type="button" aria-label="切换键盘输入">&#9000;</button>
      <button id="btnMic" class="mic-btn" type="button" aria-label="按下说话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </button>
      <button id="btnStop" class="side-btn stop-btn" type="button" aria-label="停止朗读" hidden>&#9632;</button>
    </footer>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<dialog id="settingsDialog" class="sheet">
  <form id="settingsForm" class="sheet-inner">
    <div class="sheet-head">
      <h2>设置</h2>
      <button type="button" class="icon-btn" id="btnCloseSettings" aria-label="关闭设置">&#10005;</button>
    </div>

    <label class="field">
      <span class="field-label">DeepSeek API Key</span>
      <input id="apiKeyInput" type="password" placeholder="sk-..." autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>
    <p class="hint">在 <a href="https://platform.deepseek.com" target="_blank" rel="noopener">platform.deepseek.com</a> 的「API keys」里创建一个。Key 只保存在这台手机的浏览器里，不会写进网页代码。</p>

    <label class="field">
      <span class="field-label">朗读语速 <em id="rateLabel">0.95×</em></span>
      <input id="rateInput" type="range" min="0.6" max="1.2" step="0.05" value="0.95">
    </label>

    <label class="switch-row">
      <span>自动朗读教练回复</span>
      <input id="autoSpeakInput" type="checkbox" checked>
    </label>

    <div class="sheet-actions">
      <button type="button" class="ghost-btn" id="btnClear">清空对话</button>
      <button type="submit" class="primary-btn">保存</button>
    </div>

    <button type="button" class="ghost-btn full" id="btnForceUpdate">强制更新到最新版</button>

    <p class="hint tiny"><span id="appVersion">Echo v7</span> · iPhone 用 Safari 打开后「分享 → 添加到主屏幕」，就能像 App 一样用啦。</p>
  </form>
</dialog>

<script src="js/app.js?v=7"></script>
</body>
</html>
